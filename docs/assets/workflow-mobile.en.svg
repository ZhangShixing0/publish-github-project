<svg xmlns="http://www.w3.org/2000/svg" width="440" height="650" viewBox="0 0 440 650" role="img" aria-labelledby="title desc">
<title id="title">Four steps from a local project to GitHub</title>
<desc id="desc">Understand the scope, organize the README and real media, verify content, then publish as authorized and check the result.</desc>
<rect x="1" y="1" width="438" height="648" rx="18" fill="#f7f7f0" stroke="#dce3d9"/>
<g font-family="'Segoe UI','Microsoft YaHei',sans-serif">
<rect x="24" y="22" width="392" height="134" rx="12" fill="#ffffff" stroke="#dce3d9"/>
<text x="44" y="56" font-size="18" font-weight="700" fill="#53685d">01</text>
<text x="88" y="57" font-size="26" font-weight="700" fill="#16352a">Understand</text>
<text x="44" y="100" font-size="20" fill="#16352a">Define project &amp; scope</text>
<text x="44" y="134" font-size="18" fill="#53685d">Code · Docs · Media</text>
<path d="M220 162v9m-4-4 4 4 4-4" fill="none" stroke="#638c73" stroke-width="2"/>
<rect x="24" y="176" width="392" height="134" rx="12" fill="#ffffff" stroke="#dce3d9"/>
<text x="44" y="210" font-size="18" font-weight="700" fill="#53685d">02</text>
<text x="88" y="211" font-size="26" font-weight="700" fill="#16352a">Organize</text>
<text x="44" y="254" font-size="20" fill="#16352a">Explain value &amp; first use</text>
<text x="44" y="288" font-size="18" fill="#53685d">README · Diagrams · Images</text>
<path d="M220 316v9m-4-4 4 4 4-4" fill="none" stroke="#638c73" stroke-width="2"/>
<rect x="24" y="330" width="392" height="134" rx="12" fill="#ffffff" stroke="#dce3d9"/>
<text x="44" y="364" font-size="18" font-weight="700" fill="#53685d">03</text>
<text x="88" y="365" font-size="26" font-weight="700" fill="#16352a">Verify</text>
<text x="44" y="408" font-size="20" fill="#16352a">Check files &amp; media</text>
<text x="44" y="442" font-size="18" fill="#53685d">Tests · Links · Privacy</text>
<path d="M220 470v9m-4-4 4 4 4-4" fill="none" stroke="#638c73" stroke-width="2"/>
<rect x="24" y="484" width="392" height="134" rx="12" fill="#234e40" stroke="#234e40"/>
<text x="44" y="518" font-size="18" font-weight="700" fill="#d7e7db">04</text>
<text x="88" y="519" font-size="26" font-weight="700" fill="#ffffff">Publish</text>
<text x="44" y="562" font-size="20" fill="#ffffff">Publish &amp; check results</text>
<text x="44" y="596" font-size="18" fill="#d7e7db">Repository / PR · Review</text>
</g></svg>
