<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="250" viewBox="0 0 1120 250" role="img" aria-labelledby="title desc">
<title id="title">从项目到 GitHub 的四步流程</title>
<desc id="desc">检查范围、文件与隐私；整理 README 和真实素材；运行测试并审核提交内容；发布后核对文件、元数据与页面。</desc>
<rect x="1" y="1" width="1118" height="248" rx="18" fill="#f6f8fa" stroke="#d0d7de"/>
<g font-family="'Segoe UI','Microsoft YaHei',sans-serif">
<rect x="22" y="24" width="248" height="202" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="42" y="56" font-size="16" font-weight="700" fill="#176b50">01</text>
<text x="42" y="93" font-size="27" font-weight="700" fill="#172b3a">检查</text>
<text x="42" y="126" font-size="19" fill="#33475b">范围 · 文件 · 隐私</text>
<text x="42" y="188" font-size="17" fill="#576576">明确发布内容</text>
<path d="M277 125h14m-5-5 5 5-5 5" fill="none" stroke="#176b50" stroke-width="2"/>
<rect x="298" y="24" width="248" height="202" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="318" y="56" font-size="16" font-weight="700" fill="#176b50">02</text>
<text x="318" y="93" font-size="27" font-weight="700" fill="#172b3a">整理</text>
<text x="318" y="126" font-size="19" fill="#33475b">README · 真实素材</text>
<text x="318" y="188" font-size="17" fill="#576576">解释问题与流程</text>
<path d="M553 125h14m-5-5 5 5-5 5" fill="none" stroke="#176b50" stroke-width="2"/>
<rect x="574" y="24" width="248" height="202" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="594" y="56" font-size="16" font-weight="700" fill="#176b50">03</text>
<text x="594" y="93" font-size="27" font-weight="700" fill="#172b3a">验证</text>
<text x="594" y="126" font-size="19" fill="#33475b">测试 · 链接 · 暂存区</text>
<text x="594" y="188" font-size="17" fill="#576576">核对准备提交的内容</text>
<path d="M829 125h14m-5-5 5 5-5 5" fill="none" stroke="#176b50" stroke-width="2"/>
<rect x="850" y="24" width="248" height="202" rx="12" fill="#ffffff" stroke="#d0d7de"/>
<text x="870" y="56" font-size="16" font-weight="700" fill="#176b50">04</text>
<text x="870" y="93" font-size="27" font-weight="700" fill="#172b3a">发布</text>
<text x="870" y="126" font-size="19" fill="#33475b">上传 · 元数据 · 页面</text>
<text x="870" y="188" font-size="17" fill="#576576">核对实际发布结果</text>
</g>
</svg>
